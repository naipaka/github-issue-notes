name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js, and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Type check
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
